name: Monitor Renfe

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Trayecto"
        required: false
        type: choice
        default: "Sin cambiar"
        options:
          - "Sin cambiar"
          - "OURENSE → A CORUÑA"
          - "A CORUÑA → OURENSE"
      date:
        description: "Fecha (DD/MM/AAAA o AAAA-MM-DD)"
        required: false
        type: string
      time_from:
        description: "Desde (HH:MM)"
        required: false
        type: string
      time_to:
        description: "Hasta (HH:MM)"
        required: false
        type: string
      passengers:
        description: "Pasajeros"
        required: false
        type: string
      active:
        description: "Estado del monitor"
        required: false
        type: choice
        default: "Sin cambiar"
        options:
          - "Sin cambiar"
          - "Activar"
          - "Desactivar"
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: renfe-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Aplicar configuración elegida
        if: github.event_name == 'workflow_dispatch'
        env:
          DIRECTION: ${{ inputs.direction }}
          SEARCH_DATE: ${{ inputs.date }}
          TIME_FROM: ${{ inputs.time_from }}
          TIME_TO: ${{ inputs.time_to }}
          PASSENGERS: ${{ inputs.passengers }}
          ACTIVE: ${{ inputs.active }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime
          from pathlib import Path

          path = Path("config.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))

          direction = os.getenv("DIRECTION", "").strip()
          if direction == "OURENSE → A CORUÑA":
              cfg["origin"], cfg["destination"] = "OURENSE", "A CORUÑA"
          elif direction == "A CORUÑA → OURENSE":
              cfg["origin"], cfg["destination"] = "A CORUÑA", "OURENSE"

          date = os.getenv("SEARCH_DATE", "").strip()
          if date:
              parsed = None
              for fmt in ("%Y-%m-%d", "%d/%m/%Y"):
                  try:
                      parsed = datetime.strptime(date, fmt)
                      break
                  except ValueError:
                      pass
              if parsed is None:
                  raise ValueError("Fecha inválida. Usa DD/MM/AAAA o AAAA-MM-DD")
              cfg["date"] = parsed.strftime("%Y-%m-%d")

          for env_name, key in [("TIME_FROM", "time_from"), ("TIME_TO", "time_to")]:
              value = os.getenv(env_name, "").strip()
              if value:
                  datetime.strptime(value, "%H:%M")
                  cfg[key] = value

          passengers = os.getenv("PASSENGERS", "").strip()
          if passengers:
              n = int(passengers)
              if n < 1 or n > 9:
                  raise ValueError("Pasajeros debe estar entre 1 y 9")
              cfg["passengers"] = n

          active = os.getenv("ACTIVE", "").strip()
          if active == "Activar":
              cfg["active"] = True
          elif active == "Desactivar":
              cfg["active"] = False

          if cfg["time_from"] > cfg["time_to"]:
              raise ValueError("La hora Desde no puede ser posterior a Hasta")

          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("CONFIG ELEGIDA:", json.dumps(cfg, ensure_ascii=False))
          PY

          if ! git diff --quiet -- config.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.json
            git commit -m "Update Renfe search configuration [skip ci]"
            git push
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ejecutar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Guardar estado anti-duplicados
        if: success()
        run: |
          if [ -f state.json ] && ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Renfe availability state"
            git push
          elif [ -f state.json ] && ! git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Initialize Renfe availability state"
            git push
          else
            echo "Sin cambios de disponibilidad."
          fi

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renfe-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
