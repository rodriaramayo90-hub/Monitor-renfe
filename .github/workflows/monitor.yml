name: Monitor Renfe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: renfe-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ejecutar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Guardar estado anti-duplicados
        if: success()
        run: |
          if [ -f state.json ] && ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Renfe availability state"
            git push
          elif [ -f state.json ] && ! git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Initialize Renfe availability state"
            git push
          else
            echo "Sin cambios de disponibilidad."
          fi

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renfe-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
